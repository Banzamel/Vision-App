; Vision production supervisor config
;
; Install:
;   sudo cp supervisor-vision.conf /etc/supervisor/conf.d/vision.conf
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl status        # should show vision-queue:00, vision-queue:01, vision-reverb running
;
; After every code deploy:
;   php artisan queue:restart        # workers self-restart with new code
;   sudo supervisorctl restart vision-reverb  # Reverb needs explicit restart

; Bez --queue celowo: queue:work bierze nazwę kolejki z konfiguracji połączenia
; (queue.connections.redis.queue → REDIS_QUEUE w .env, u nas `vision-default`).
; Nie dopisuj tu --queue=default — worker przestałby widzieć własne joby.
[program:vision-queue]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php8.4 /home/webmaster/web/vision.banzamel.pl/private/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
directory=/home/webmaster/web/vision.banzamel.pl/private
autostart=true
autorestart=true
user=webmaster
numprocs=2
redirect_stderr=true
stdout_logfile=/home/webmaster/web/vision.banzamel.pl/private/storage/logs/queue.log
stopwaitsecs=3600

[program:vision-reverb]
command=/usr/bin/php8.4 /home/webmaster/web/vision.banzamel.pl/private/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/home/webmaster/web/vision.banzamel.pl/private
autostart=true
autorestart=true
user=webmaster
redirect_stderr=true
stdout_logfile=/home/webmaster/web/vision.banzamel.pl/private/storage/logs/reverb.log
stopwaitsecs=10
