# Vision production nginx fragment — INCLUDED inside HestiaCP server { } block
# (path on server: /home/webmaster/conf/web/vision.banzamel.pl/nginx.ssl.conf_custom)
#
# Instalacja na serwerze:
#   sudo cp /home/webmaster/web/vision.banzamel.pl/private/deploy/nginx-vision.conf \
#           /home/webmaster/conf/web/vision.banzamel.pl/nginx.ssl.conf_custom
#   sudo nginx -t && sudo systemctl reload nginx

location = /sw.js {
    root /home/webmaster/web/vision.banzamel.pl/public_html;
    expires 0;
    add_header Cache-Control "no-store, must-revalidate";
    try_files /sw.js =404;
}

location = /index.html {
    root /home/webmaster/web/vision.banzamel.pl/public_html;
    expires 0;
    add_header Cache-Control "no-store, must-revalidate";
    try_files /index.html =404;
}

location = /manifest.webmanifest {
    root /home/webmaster/web/vision.banzamel.pl/public_html;
    expires 0;
    add_header Cache-Control "no-store, must-revalidate";
    try_files /manifest.webmanifest =404;
}

# ── Backend: /api, /oauth, /broadcasting, /up → Laravel PHP-FPM ──────────
# /api           REST API + kreator instalacji (/api/install/*)
# /oauth         Passport: login, refresh, social
# /broadcasting  autoryzacja kanałów Reverb
# /up            health check (bootstrap/app.php → health: '/up')
#
# Regex location wygrywa z prefix /, więc proxy do Apache pomija to.
# Wszystko leci wprost do Laravel index.php przez fastcgi.
# UWAGA: React-owy route /install (kreator SPA) NIE jest tu wymieniony — jego HTML
# serwuje public_html, a wizard rozmawia z backendem po /api/install/*.
location ~ ^/(api|oauth|broadcasting|up)(/|$) {
    fastcgi_pass unix:/run/php/php8.4-fpm-vision.banzamel.pl.sock;
    fastcgi_param SCRIPT_FILENAME /home/webmaster/web/vision.banzamel.pl/private/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_ROOT /home/webmaster/web/vision.banzamel.pl/private/public;
    fastcgi_param REQUEST_URI $request_uri;
    fastcgi_param QUERY_STRING $query_string;
    fastcgi_param HTTPS on;
    fastcgi_param SERVER_PROTOCOL $server_protocol;
    fastcgi_param HTTP_HOST $host;
    include fastcgi_params;
    fastcgi_read_timeout 60s;
    client_max_body_size 50m;
}

# ── WebSocket: /ws → Reverb na 127.0.0.1:8080 ────────────────────────────
# Klient (pusher-js z wsPath=/ws) puka w /ws/app/{key}; trailing slash w proxy_pass ucina
# prefiks /ws/, więc Reverb widzi swoje natywne /app/{key} i NIE wymaga REVERB_SERVER_PATH.
#
# Wcześniej było to /app — kolidowało z przestrzenią routingu SPA i zjadało cały prefiks
# /app* domeny. /ws jest jednoznacznie serwerowe.
#
# proxy_pass_header Upgrade nadpisuje server-level "proxy_hide_header Upgrade"
# z Hestii defaultowego template (inaczej WS handshake by się wywalił).
location /ws/ {
    proxy_pass http://127.0.0.1:8080/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass_header Upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
